[package]
name = "wziper"
version = "0.1.0"
edition = "2021"
description = "A modern desktop file archiver for Windows"
license = "MIT"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.29"
rfd = "0.15"
walkdir = "2.5"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
flate2 = "1.0"
tar = "0.4"
zstd = "0.13"

[build-dependencies]
winres = "0.1"
